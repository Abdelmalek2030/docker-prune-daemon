name: Continuous Go Fuzzing & Race Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  fuzz:
    name: Hermetic Fuzz & Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Execute Fuzz Seed Corpus & Race Detector Suite
        run: |
          go vet ./...
          go test -v -race ./...
