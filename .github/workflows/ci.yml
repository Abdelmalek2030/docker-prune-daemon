name: CI Matrix & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Go 1.22 / Linux AMD64 & ARM64 Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22']
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify gofmt formatting
        run: test -z "$(gofmt -s -l .)"

      - name: Run static analysis (go vet)
        run: go vet ./...

      - name: Execute race-detector unit tests
        run: go test -v -race -cover ./...

      - name: Verify static compilation (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o docker-prune-daemon .
