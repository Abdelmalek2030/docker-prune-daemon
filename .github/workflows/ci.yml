name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Go Vet, Race Test & Static Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Formatting & Go Vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...

      - name: Execute Unit Tests with Race Detector
        run: go test -v -race ./...

      - name: Execute Syscall Benchmarks
        run: go test -bench=. -benchmem ./...

      - name: Build Stripped Static Binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o docker-prune-daemon .
