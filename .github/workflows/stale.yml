name: Close Stale Issues and PRs

on:
  schedule:
    - cron: '30 1 * * *' # Chạy tự động mỗi ngày lúc 1:30 sáng

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: 'This issue has been marked as stale because it has had no recent activity. It will be closed in 14 days if no further activity occurs.'
          stale-pr-message: 'This pull request has been marked as stale because it has had no recent activity.'
          stale-issue-label: 'status/stale'
          stale-pr-label: 'status/stale'
